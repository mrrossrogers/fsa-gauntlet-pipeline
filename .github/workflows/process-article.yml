name: FSA Gauntlet — process-article ping

# Free replacement for Vercel Cron (Hobby plan only allows daily crons).
# GitHub Actions scheduled workflows are free for this volume of usage —
# a single curl every 5 minutes costs well under GitHub's free minutes.
#
# SETUP:
# 1. Put this file at .github/workflows/process-article.yml in ANY GitHub
#    repo you control (doesn't need to be your app's code repo).
# 2. In that repo: Settings -> Secrets and variables -> Actions -> New
#    repository secret, name it FSA_APP_URL, value = your deployed Vercel
#    URL (e.g. https://fsa-gauntlet-pipeline-ross-rogers.vercel.app)
# 3. Add a second repository secret, FSA_CRON_SECRET, matching the
#    FSA_CRON_SECRET environment variable set in the Vercel project.
#    api/process-article.js now requires either an owner session or this
#    bearer token (lib/auth.js requireOwner / requestHasCronSecret) --
#    without this secret every scheduled ping gets a 401 and does nothing.
# 4. Push it. Confirm under the repo's "Actions" tab that it's enabled and
#    the schedule shows up.
#
# Note: GitHub's schedule is "best effort," not exact-to-the-second — under
# normal load it fires close to every 5 minutes, occasionally a bit later.
# Fine for this use case.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}   # lets you also trigger it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping process-article
        run: |
          curl -sf "${{ secrets.FSA_APP_URL }}/api/process-article" \
            -H "Authorization: Bearer ${{ secrets.FSA_CRON_SECRET }}" \
            -o /dev/null -w "status: %{http_code}\n"
